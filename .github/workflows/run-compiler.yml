name: Run Function Definition Compiler

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run compiler
        run: python main.py < sample_input.txt
